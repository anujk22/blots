<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blots · Home</title><link rel="icon" href="/avatar.png"><style>
:root{--agent:#2155ee;--paper:color-mix(in srgb,var(--agent) 14%,#ffffff);--ink:color-mix(in srgb,var(--agent) 22%,#574745);--outline:color-mix(in srgb,var(--agent) 22%,#bda6a0)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,'Liberation Sans',sans-serif;min-height:100vh;overflow-x:hidden;color-scheme:light}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--agent);outline-offset:5px}.pattern{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;stroke:var(--outline);stroke-width:1.5;fill:none;opacity:.65}.welcome{position:relative;padding:22px 0 25px;text-align:center;min-height:742px}.tip{position:relative;width:240px;min-height:86px;margin:0 auto 0;padding:16px 32px 16px 16px;transform:translateX(36px);text-align:left;font-size:13px;line-height:19px;color:#454545;background:#fff;border-radius:21px}.tip::after{content:'';position:absolute;bottom:-11px;right:43px;border-left:12px solid transparent;border-right:12px solid transparent;border-top:12px solid #fff}.tip button{position:absolute;top:10px;right:10px;width:20px;height:20px;border:0;background:transparent;color:#999;font-size:20px;line-height:20px;padding:0}.tip.dismissed{visibility:hidden}.portrait{width:100px;height:100px;object-fit:contain;display:block;margin:0 auto}.initial{display:grid;place-items:center;background:var(--agent);color:white;border-radius:42%;font-size:48px}.clock{display:flex;align-items:baseline;justify-content:center;gap:10px;margin:0;height:78px}.clock strong{font-size:70px;line-height:78px;font-weight:400;letter-spacing:-5px}.clock small{font-size:11px;text-transform:uppercase}h1{font-size:24px;line-height:30px;font-weight:400;margin:14px 0 0}.apps{display:grid;grid-template-columns:repeat(5,80px);column-gap:14px;row-gap:34px;justify-content:center;margin:54px auto 0;width:max-content;max-width:100%}.apps button{display:flex;flex-direction:column;align-items:center;gap:9px;width:80px;min-height:86px;padding:0;border:0;background:transparent;color:var(--ink);font-size:13px;line-height:16px}.tile{display:grid;place-items:center;width:50px;height:50px;border-radius:15px;background:#ffffffb8;transition:background .15s,transform .15s}.apps img{width:34px;height:34px;object-fit:contain}.apps button:hover .tile{background:white;transform:translateY(-2px)}#status{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:white;box-shadow:0 2px 10px #0002;max-width:80%;z-index:2}#status:empty{display:none}@media(max-width:500px){.apps{grid-template-columns:repeat(3,80px)}.tip{transform:translateX(18px)}}@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style></head><body>
<svg class="pattern" viewBox="0 0 1120 740" preserveAspectRatio="xMidYMin slice" aria-hidden="true"><defs>
<g id="blot"><path d="M8 22C-2 15 4 5 12 10C13-3 23-1 26 10C34 3 42 10 35 20C46 30 35 41 24 35C15 43 3 34 8 22Z"/></g>
<g id="leaf"><path d="M18 43C15 20 11 13 3 6C-1 20 5 27 16 28M18 43C15 19 21 8 37 5C41 20 32 30 17 29"/></g>

<g id="mushroom"><path d="M2 24C2-2 36-2 36 24ZM14 24L11 37Q20 43 28 37L25 24"/><circle cx="12" cy="15" r="2"/><circle cx="24" cy="13" r="2"/></g>

<use href="#blot" x="40" y="-18"/><use href="#mushroom" x="285" y="-28"/><use href="#drop" x="109" y="81" transform="rotate(12 130 110)"/><use href="#leaf" x="376" y="79"/><use href="#blot" x="935" y="43" transform="scale(.7) translate(406 23)"/><use href="#citrus" x="46" y="167"/><use href="#blot" x="231" y="215"/><use href="#blot" x="380" y="229" transform="rotate(-19 401 250)"/><use href="#drop" x="811" y="224" transform="scale(.8) translate(190 50)"/><use href="#blot" x="1030" y="204" transform="rotate(-12 1050 224)"/><use href="#mushroom" x="276" y="344"/><use href="#leaf" x="829" y="328" transform="rotate(-12 850 350)"/><use href="#blot" x="120" y="416" transform="scale(.7) translate(55 182)"/><use href="#citrus" x="799" y="473" transform="scale(.6) translate(525 320)"/><use href="#blot" x="99" y="590" transform="scale(.65) translate(70 332)"/><use href="#drop" x="970" y="615" transform="scale(.8) translate(270 169)"/>
</svg>
<main class="welcome"><aside class="tip" id="tip">This is my computer. Watch me work, or take control when you need to.<button aria-label="Dismiss welcome tip">×</button></aside><img class="portrait" id="portrait" src="/avatar.png" alt="Blot"><div class="clock"><strong id="time"></strong><small id="period"></small></div><h1 id="greeting">Welcome back, Blot</h1><div class="apps" id="apps" aria-label="Applications"></div></main><div id="status" role="status" aria-live="polite"></div>
<script>
const screen=Number(new URLSearchParams(location.search).get('screen')||1);
function clock(){const parts=new Intl.DateTimeFormat([],{hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(new Date());document.querySelector('#time').textContent=parts.filter(p=>p.type!=='dayPeriod').map(p=>p.value).join('').trim();document.querySelector('#period').textContent=parts.find(p=>p.type==='dayPeriod').value}clock();setInterval(clock,1000);
document.querySelector('#tip button').onclick=()=>document.querySelector('#tip').classList.add('dismissed');
let signature='',timer;
async function launch(app){try{const r=await fetch('/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app,screen})});const data=await r.json();if(!r.ok)throw new Error(data.error)}catch(e){const status=document.querySelector('#status');status.textContent=e.message;clearTimeout(timer);timer=setTimeout(()=>status.textContent='',6000)}}
async function appearance(){const data=await(await fetch('/appearance')).json();const next=JSON.stringify(data);if(signature===next)return;signature=next;document.documentElement.style.setProperty('--agent',data.color);document.title=data.name+' · Home';document.querySelector('#greeting').textContent='Welcome back, '+data.name;const old=document.querySelector('#portrait'),portrait=document.createElement(data.avatar?'img':'div');portrait.id='portrait';portrait.className='portrait'+(data.avatar?'':' initial');if(data.avatar){portrait.src='/avatar.png?avatar='+data.avatar;portrait.alt=data.name}else{portrait.textContent=data.name.slice(0,1).toUpperCase();portrait.setAttribute('aria-label',data.name)}old.replaceWith(portrait);const apps=document.querySelector('#apps');apps.replaceChildren();for(const app of data.apps){const button=document.createElement('button'),tile=document.createElement('span'),image=document.createElement('img'),label=document.createElement('span');tile.className='tile';image.src='/icons/'+app.id+'.png';image.alt='';tile.append(image);label.textContent=app.name;button.append(tile,label);button.onclick=()=>launch(app.id);apps.append(button)}}appearance();setInterval(appearance,5000);
</script></body></html>
