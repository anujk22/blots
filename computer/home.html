<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New tab</title><style>
*{box-sizing:border-box}body{margin:0;background:#d8e1ea;color:#344454;font:14px 'DejaVu Sans',sans-serif;height:100vh;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;padding:26px 32px;color:#596a7b;font-size:13px}header h1{font-size:16px;font-weight:500;margin:0}.time{font-size:12px}main{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(580px,86vw)}.search{display:flex;align-items:center;gap:12px;background:#f1f3f5;border:1px solid #c2ccd6;border-radius:24px;padding:5px 7px 5px 19px}.search svg{width:19px;height:19px;flex-shrink:0;color:#67798a}.search input{border:0;outline:0;background:transparent;padding:12px 0;min-width:0;flex:1;color:#344454;font:14px 'DejaVu Sans',sans-serif}.search input::placeholder{color:#6c7c8b}.search:focus-within{border-color:#5c83b4;outline:2px solid #5c83b425}.search button{display:grid;place-items:center;width:35px;height:35px;background:#e2e7ed;border:0;border-radius:50%;color:#4e6378;cursor:pointer}.search button svg{width:16px;height:16px}.apps{display:flex;justify-content:center;gap:32px;margin-top:38px}.apps button{display:flex;flex-direction:column;align-items:center;gap:10px;border:0;background:transparent;color:#526474;font:16px 'DejaVu Sans',sans-serif;cursor:pointer;width:96px;padding:8px;border-radius:10px}.apps button:hover{background:#c7d3df}.apps img{width:48px;height:48px;object-fit:contain}.foot{position:fixed;left:32px;bottom:24px;font-size:11px;color:#778797}button:focus-visible{outline:2px solid #527daf;outline-offset:4px}
</style></head><body><header><h1>New tab</h1><span class="time" id="clock"></span></header><main><form class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input aria-label="Search the web" placeholder="Search the web or enter an address" autocomplete="off" spellcheck="false"><button aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></form><div class="apps"><button data-app="browser"><img src="/icons/browser.png" alt="">Browser</button><button data-app="files"><img src="/icons/files.png" alt="">Files</button><button data-app="terminal"><img src="/icons/terminal.png" alt="">Terminal</button><button data-app="editor"><img src="/icons/editor.png" alt="">Editor</button></div></main><div class="foot" id="desktop"></div><script>
const screen=Number(new URLSearchParams(location.search).get('screen')||1);document.querySelector('#desktop').textContent='Desktop '+screen;
function clock(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,60000);
document.querySelector('form').onsubmit=e=>{e.preventDefault();let s=document.querySelector('input').value.trim();if(!s)return;location.href=/^https?:\/\//.test(s)?s:/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(s)?'https://'+s:'https://www.google.com/search?q='+encodeURIComponent(s)};
document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>fetch('/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:b.dataset.app,screen})}));
</script></body></html>
