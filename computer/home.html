<!doctype html>
<html><head><meta charset="utf-8"><title>Blots · Home</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9f0ff;color:#13316c;font:16px 'DejaVu Sans',sans-serif;height:100vh;display:grid;place-items:center;overflow:hidden;background-image:radial-gradient(circle at 12% 18%,#c6d9ff 0,transparent 34%),radial-gradient(circle at 87% 78%,#d3defc 0,transparent 38%)}
.orb{position:absolute;border:2px solid #c1d2f5;border-radius:43% 57% 62% 38%;width:150px;height:150px;transform:rotate(24deg);pointer-events:none}.one{left:9%;top:16%}.two{right:9%;bottom:16%;width:100px;height:100px}.three{right:18%;top:20%;width:44px;height:44px}
main{text-align:center;width:600px}.badge{display:inline-block;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#5777ac;margin-bottom:26px}.mascot{width:90px;height:90px;background:#2155ee;border-radius:40% 60% 52% 48%;margin:0 auto 24px;box-shadow:0 12px 30px #2155ee25;position:relative;transform:rotate(-8deg)}.eyes{position:absolute;top:38%;left:29%;display:flex;gap:15px}.eyes i{width:8px;height:13px;background:#fff;border-radius:8px;transform:rotate(8deg)}.smile{position:absolute;width:17px;height:9px;border-bottom:3px solid white;border-radius:50%;left:42%;top:57%}
#clock{font-size:68px;letter-spacing:-5px;line-height:1.2}#greeting{margin:9px 0 28px;color:#5a7098;font-size:15px}.search{display:flex;margin:auto;width:440px;background:#fff;border:1px solid #d5e0f5;border-radius:16px;padding:7px;box-shadow:0 10px 28px #243c6b08}.search input{border:0;outline:0;background:none;padding:10px;width:100%;color:#183668;font:14px inherit}.search button{background:#2155ee;border:0;border-radius:11px;color:white;padding:10px 16px;cursor:pointer}
.apps{display:flex;gap:22px;justify-content:center;margin-top:34px}.apps button{border:0;background:none;color:#365586;font:11px inherit;cursor:pointer;width:70px}.apps span{display:grid;place-items:center;width:48px;height:48px;background:#fff;border-radius:14px;margin:0 auto 8px;font-size:22px;box-shadow:0 4px 14px #3955870a}.foot{position:fixed;bottom:22px;font-size:11px;color:#6981aa;letter-spacing:.4px}.apps button:hover span{transform:translateY(-3px)}
</style></head><body><div class="orb one"></div><div class="orb two"></div><div class="orb three"></div><main><div class="badge">A little space to do big things</div><div class="mascot"><div class="eyes"><i></i><i></i></div><div class="smile"></div></div><div id="clock"></div><div id="greeting">Welcome to your computer</div><form class="search"><input aria-label="Search the web" placeholder="Search the web or enter an address"><button>↗</button></form><div class="apps"><button data-app="browser"><span>◉</span>Browser</button><button data-app="files"><span>▱</span>Files</button><button data-app="terminal"><span>⌘</span>Terminal</button><button data-app="editor"><span>✎</span>Editor</button></div></main><div class="foot">blots · your computer, on your Mac</div><script>
const screen=Number(new URLSearchParams(location.search).get('screen')||1);function clock(){const text=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).replace(/\s*[AP]M/i,'');if(document.querySelector('#clock').textContent!==text)document.querySelector('#clock').textContent=text}clock();setInterval(clock,1000);fetch('/health').then(r=>r.json()).then(d=>document.querySelector('#greeting').textContent=`Welcome back, ${d.name}`);document.querySelector('form').onsubmit=e=>{e.preventDefault();let s=document.querySelector('input').value.trim();if(!s)return;location.href=/^https?:\/\//.test(s)?s:/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(s)?'https://'+s:'https://www.google.com/search?q='+encodeURIComponent(s)};document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>fetch('/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:b.dataset.app,screen})}));
</script></body></html>
