<!doctype html>
<html><head><meta charset="utf-8"><title>Blots · Home</title><style>
*{box-sizing:border-box}body{margin:0;background:#000 url(/wallpaper.png) center/cover no-repeat;color:#e8eaf2;font:16px 'DejaVu Sans',sans-serif;height:100vh;display:grid;place-items:center;overflow:hidden;color-scheme:dark}
main{text-align:center;width:600px}.badge{display:inline-block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#778098;margin-bottom:8px}.mascot{width:122px;height:122px;margin:0 auto 19px;filter:drop-shadow(0 10px 28px #2155ee28)}.mascot img{width:100%;height:100%;object-fit:contain}
#clock{font-size:76px;font-weight:300;letter-spacing:-5px;line-height:1.15}#greeting{margin:12px 0 27px;color:#9296a7;font-size:14px}.search{display:flex;margin:auto;width:450px;background:#11141be8;border:1px solid #2a2e3a;border-radius:18px;padding:7px;box-shadow:0 12px 40px #0008}.search:focus-within{border-color:#597ac5}.search input{border:0;outline:0;background:none;padding:11px 13px;width:100%;color:#dadde8;font:14px 'DejaVu Sans',sans-serif}.search input::placeholder{color:#777f95}.search button{background:#315be4;border:0;border-radius:12px;color:white;padding:10px 16px;cursor:pointer}
.apps{display:flex;gap:23px;justify-content:center;margin-top:28px}.apps button{border:0;background:none;color:#9099ad;font:11px 'DejaVu Sans',sans-serif;cursor:pointer;width:70px}.apps span{display:grid;place-items:center;width:49px;height:49px;background:#151820;border:1px solid #293042;border-radius:15px;margin:0 auto 9px;font-size:24px;color:#9bb4ff}.foot{position:fixed;bottom:20px;font-size:10px;color:#515a6e;letter-spacing:.4px}.apps button:hover span{transform:translateY(-3px);background:#20283a}button:focus-visible{outline:2px solid #7ca2ff;outline-offset:4px}
</style></head><body><main><div class="badge">Your own little corner</div><div class="mascot"><img src="/mascot.png" alt="Blot"></div><div id="clock"></div><div id="greeting">Welcome to your computer</div><form class="search"><input aria-label="Search the web" placeholder="Search the web or enter an address"><button>↗</button></form><div class="apps"><button data-app="browser"><span>◉</span>Browser</button><button data-app="files"><span>▱</span>Files</button><button data-app="terminal"><span>⌘</span>Terminal</button><button data-app="editor"><span>✎</span>Editor</button></div></main><div class="foot">blots · your computer, on your Mac</div><script>
const screen=Number(new URLSearchParams(location.search).get('screen')||1);function clock(){const text=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).replace(/\s*[AP]M/i,'');if(document.querySelector('#clock').textContent!==text)document.querySelector('#clock').textContent=text}clock();setInterval(clock,1000);fetch('/health').then(r=>r.json()).then(d=>document.querySelector('#greeting').textContent=`Welcome back, ${d.name}`);document.querySelector('form').onsubmit=e=>{e.preventDefault();let s=document.querySelector('input').value.trim();if(!s)return;location.href=/^https?:\/\//.test(s)?s:/^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(s)?'https://'+s:'https://www.google.com/search?q='+encodeURIComponent(s)};document.querySelectorAll('[data-app]').forEach(b=>b.onclick=()=>fetch('/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:b.dataset.app,screen})}));
</script></body></html>
